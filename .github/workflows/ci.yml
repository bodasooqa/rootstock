# CI проекта. Общие проверки — в `harness.yml` (управляемый, обновляется
# шаблоном); свои джобы проект пишет здесь, рядом с вызовом.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Прогон устаревает, как только в ветку приходит следующий коммит.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    uses: ./.github/workflows/harness.yml
    permissions:
      contents: read
      pull-requests: read
    # Свой раннер: метка строкой или массив меток в JSON. Общую джобу rust или
    # js (входы есть, если проект их выбрал), которой нужно своё окружение —
    # база, переменные, — проект выключает и пишет свою ниже.
    # with:
    #   runs-on: '["self-hosted", "ci"]'
    #   rust: false
    #   js: false

  # Свои джобы проекта — ниже.

  # Тесты на Windows и macOS. Linux гоняет джоба `rust` из `harness.yml`.
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Красная ОС не должна скрывать результат другой.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Тулчейн берётся из rust-toolchain.toml: rustup доставит компоненты сам.
      - uses: Swatinem/rust-cache@v2

      # Сборка под Windows ловит то, что на macOS не видно: код под `cfg(windows)`.
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты
        run: cargo test --locked
