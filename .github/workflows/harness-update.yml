# Harness update: a new template version arrives in the project as a PR.
# Managed file: updated by the template, not edited by hand.
#
# Once a day and on demand, compares the template tags with the project version
# (`version` in .rootstock.toml). If there is a newer one: `rootstock update` to it
# (.harness/update/update.sh), conflicts as markers in files, a PR "Update
# harness to vX.Y.Z" from branch harness/update-vX.Y.Z. harness-automerge.yml
# merges it after green CI.
#
# PR labels (created here too):
#   harness:major     major version: merged by hand, see the template CHANGELOG;
#   harness:conflict  merge conflict: markers in files, CI red.
#
# A PR for the same tag is not duplicated. Open update PRs for an earlier tag
# are closed with a comment: the new one includes them. A PR closed without
# merging is not reopened on schedule, only by a manual run.
#
# Setup: .harness/local/README.md: the HARNESS_UPDATE_TOKEN secret, optionally
# the HARNESS_RUNNER and HARNESS_TEMPLATE_URL variables.
name: harness-update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Template version, tag vX.Y.Z; empty means the latest
        type: string
        required: false

concurrency:
  group: harness-update
  cancel-in-progress: false

# GITHUB_TOKEN only reads: a PR it opens doesn't trigger CI, and it may not push
# changes to .github/workflows/. Everything that writes uses the
# HARNESS_UPDATE_TOKEN token.
permissions:
  contents: read

env:
  # Changed the rootstock version? Change the archive sums in the "rootstock"
  # step too (the release SHA256SUMS).
  ROOTSTOCK_VERSION: 0.1.0
  # gh, for a runner that lacks it (the "Tools" step).
  GH_VERSION: 2.102.0
  TEMPLATE_URL: ${{ vars.HARNESS_TEMPLATE_URL || 'https://github.com/bodasooqa/harness' }}

jobs:
  update:
    name: update
    # Runner: the HARNESS_RUNNER repository variable: a label string
    # (`self-hosted`) or a JSON array of labels (`["self-hosted", "ci"]`).
    runs-on: ${{ vars.HARNESS_RUNNER && (startsWith(vars.HARNESS_RUNNER, '[') && fromJSON(vars.HARNESS_RUNNER) || vars.HARNESS_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.HARNESS_UPDATE_TOKEN }}
      REPO: ${{ github.repository }}
      WANT: ${{ inputs.version }}
      EVENT: ${{ github.event_name }}
    steps:
      # A hosted runner has gh, a self-hosted one may not. Then it is installed
      # at a pinned version into the job directory, leaving the runner system
      # untouched. The same step is in harness-automerge.yml.
      - name: Tools
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 && exit 0
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) gh_arch=amd64 ;;
            Linux/aarch64|Linux/arm64) gh_arch=arm64 ;;
            *)
              echo "::error title=No gh::The $(uname -s)/$(uname -m) runner needs gh: this step installs it only on Linux x86_64 and arm64."
              exit 1 ;;
          esac
          bin="$RUNNER_TEMP/harness-bin"
          mkdir -p "$bin"
          name="gh_${GH_VERSION}_linux_${gh_arch}"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${name}.tar.gz" \
            | tar -xz -C "$bin" --strip-components=2 "${name}/bin/gh"
          echo "$bin" >>"$GITHUB_PATH"

      # The token owner is the author of the update PR and its commits. The same
      # identity (name is the login, email is the GitHub noreply) is checked by
      # harness-automerge.yml.
      - name: Secret
        id: me
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=No HARNESS_UPDATE_TOKEN secret::Create the HARNESS_UPDATE_TOKEN secret in Settings → Secrets and variables → Actions: a fine-grained PAT for this repository with Contents RW, Pull requests RW, Issues RW (PR labels), Workflows RW, Metadata R. Details: .harness/local/README.md."
            exit 1
          fi
          read -r login id < <(gh api user --jq '"\(.login) \(.id)"')
          echo "login=$login" >>"$GITHUB_OUTPUT"
          echo "email=$id+$login@users.noreply.github.com" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          set -euo pipefail
          record=.rootstock.toml
          if [ ! -f "$record" ]; then
            echo "::error title=No .rootstock.toml::The project is not on rootstock. A Copier project moves over via the v0.5.x bridge release: update the harness to it, then to this version. Steps: the template CHANGELOG.md, section v1.0.0."
            exit 1
          fi
          # A top-level key of the record (before the first table): `key = "value"`.
          value() {
            awk -v key="$1" '/^[ \t]*\[/ { exit }
              $0 ~ ("^" key "[ \t]*=") { v = substr($0, index($0, "=") + 1); gsub(/^[ \t"\047]+|[ \t"\047]+$/, "", v); print v; exit }' "$record"
          }
          # The update source is the record's `source`: rootstock update takes the
          # template from there, while the tags here come from TEMPLATE_URL. They
          # must not diverge, or the version would come from one repository and
          # the files from another.
          norm() {
            local u=$1
            case "$u" in
              gh:*) u="https://github.com/${u#gh:}" ;;
              git@github.com:*) u="https://github.com/${u#git@github.com:}" ;;
            esac
            u=${u%/}
            printf '%s' "${u%.git}"
          }
          src=$(value source)
          if [ "$(norm "$src")" != "$(norm "$TEMPLATE_URL")" ]; then
            echo "::error title=Template source::source in $record ($src) does not match the tag source ($TEMPLATE_URL). Fix source or the HARNESS_TEMPLATE_URL variable."
            exit 1
          fi
          git ls-remote --tags --refs "$TEMPLATE_URL" | cut -f2 >"$RUNNER_TEMP/tags"
          out=$(.harness/update/next-version.sh ${WANT:+--want "$WANT"} "$(value version)" <"$RUNNER_TEMP/tags")
          printf '%s\n' "$out" | tee -a "$GITHUB_OUTPUT"
          next=$(printf '%s\n' "$out" | sed -n 's/^next=//p')
          current=$(printf '%s\n' "$out" | sed -n 's/^current=//p')
          if [ -z "$next" ]; then
            echo "Harness $current: nothing to update." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: PR already exists?
        id: existing
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          LOGIN: ${{ steps.me.outputs.login }}
        run: |
          set -euo pipefail
          branch="harness/update-$NEXT"
          # Only our own PRs: from this repository and opened by the token owner.
          # A PR from a fork with the same branch doesn't count.
          ours() {
            gh pr list -R "$REPO" --state "$1" --head "$branch" \
              --json number,mergedAt,author,isCrossRepository |
              jq -r --arg me "$LOGIN" "[.[] | select(.isCrossRepository == false and .author.login == \$me) $2][0].number // empty"
          }
          open=$(ours open "")
          if [ -n "$open" ]; then
            echo "The update to $NEXT is already waiting in PR #$open." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          closed=$(ours closed "| select(.mergedAt == null)")
          if [ -n "$closed" ] && [ "$EVENT" = schedule ]; then
            echo "PR #$closed updating to $NEXT was closed without merging: not reopening on schedule; run the workflow manually." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"

      # rootstock at a pinned version from its GitHub release, with an archive
      # checksum check, into the job directory; the runner system is untouched.
      - name: rootstock
        if: steps.version.outputs.next != '' && steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) target=x86_64-unknown-linux-musl sum=575a7587822bbdc0f661d8fe6d02309757056386eb835a82b1012e6751bf088c ;;
            Linux/aarch64|Linux/arm64) target=aarch64-unknown-linux-musl sum=93d4feb3b5bccd67c96106e829f84aaa2ab96c846f8e5ade4318bc18e956b5b4 ;;
            Darwin/arm64) target=aarch64-apple-darwin sum=972a063eb1ac1fa2125ef86e06c7568f92f9dd25cd8a7a9bb619ec2a2010083e ;;
            Darwin/x86_64) target=x86_64-apple-darwin sum=a9474430a4a3fbd4613c9d0454478603204be06a6b4bd39c827efe3ca899c180 ;;
            *)
              echo "::error title=No rootstock::This step does not install rootstock on a $(uname -s)/$(uname -m) runner: only Linux and macOS, x86_64 and arm64."
              exit 1 ;;
          esac
          name="rootstock-v${ROOTSTOCK_VERSION}-${target}"
          archive="$RUNNER_TEMP/$name.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/bodasooqa/rootstock/releases/download/v${ROOTSTOCK_VERSION}/${name}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            got=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            got=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          if [ "$got" != "$sum" ]; then
            echo "::error title=rootstock checksum::Archive $name.tar.gz does not match the pinned checksum: $got instead of $sum."
            exit 1
          fi
          bin="$RUNNER_TEMP/rootstock-bin"
          mkdir -p "$bin"
          tar -xzf "$archive" -C "$bin" --strip-components=1 "$name/rootstock"
          echo "$bin" >>"$GITHUB_PATH"
          "$bin/rootstock" --version

      - name: Update and PR
        if: steps.version.outputs.next != '' && steps.existing.outputs.skip == 'false'
        env:
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
          MAJOR: ${{ steps.version.outputs.major }}
          LOGIN: ${{ steps.me.outputs.login }}
          EMAIL: ${{ steps.me.outputs.email }}
        run: |
          set -euo pipefail
          branch="harness/update-$NEXT"

          # The commit carries the token owner's identity. The global git config
          # stays untouched: the runner may be self-hosted.
          export GIT_AUTHOR_NAME="$LOGIN" GIT_COMMITTER_NAME="$LOGIN"
          export GIT_AUTHOR_EMAIL="$EMAIL" GIT_COMMITTER_EMAIL="$EMAIL"

          # Update and commit; conflicts as `<kind> <path>` lines.
          conflicts=$(.harness/update/update.sh "$NEXT")
          push_url="${GITHUB_SERVER_URL/https:\/\//https://x-access-token:$GH_TOKEN@}/$REPO.git"
          git push --quiet --force "$push_url" "HEAD:refs/heads/$branch"

          gh label create harness:major -R "$REPO" --force --color B60205 \
            --description "Major harness version: merged by hand"
          gh label create harness:conflict -R "$REPO" --force --color D93F0B \
            --description "Harness update conflict: resolved by hand"

          body="$RUNNER_TEMP/body.md"
          labels=()
          {
            echo "Harness update from $CURRENT to [$NEXT]($TEMPLATE_URL/releases/tag/$NEXT)."
            if [ "$MAJOR" = true ]; then
              labels+=(--label harness:major)
              echo
              echo "**Major version: merged by hand, see the [shared CHANGELOG]($TEMPLATE_URL/blob/$NEXT/CHANGELOG.md)** for the migration steps."
            fi
            if [ -n "$conflicts" ]; then
              labels+=(--label harness:conflict)
              echo
              echo "**Conflict:** project changes diverged from the template (kind in parentheses; \`markers\` means markers in the file). Resolve in this branch and merge by hand after green CI (automerge skips commits not from the update):"
              echo
              # A line is `<kind> <path>`, the path may contain spaces. Backticks
              # in the format are Markdown, not substitution.
              # shellcheck disable=SC2016
              printf '%s\n' "$conflicts" | while read -r kind path; do
                printf -- '- `%s` (%s)\n' "$path" "$kind"
              done
            fi
            echo
            echo "Without the \`harness:major\` and \`harness:conflict\` labels the PR merges itself after green CI (harness-automerge.yml)."
          } >"$body"

          # The base is the branch the workflow runs on (on schedule, the main one).
          url=$(gh pr create -R "$REPO" --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Update harness to $NEXT" --body-file "$body" "${labels[@]}")
          echo "Opened $url: $CURRENT → $NEXT${labels[*]:+ (${labels[*]})}." | tee -a "$GITHUB_STEP_SUMMARY"

          # Open update PRs for an earlier tag are stale.
          number=${url##*/}
          # Only our own: from this repository and opened by the token owner.
          # $me is a jq variable, not a shell one.
          # shellcheck disable=SC2016
          gh pr list -R "$REPO" --state open --json number,headRefName,author,isCrossRepository |
            jq -r --arg me "$LOGIN" '.[]
              | select(.isCrossRepository == false and .author.login == $me)
              | select(.headRefName | startswith("harness/update-"))
              | "\(.number) \(.headRefName)"' |
            while read -r n ref; do
              old=${ref#harness/update-}
              if [ "$n" != "$number" ] && .harness/update/next-version.sh --lt "$old" "$NEXT" 2>/dev/null; then
                gh pr close "$n" -R "$REPO" --delete-branch --comment "Superseded by #$number: update to $NEXT."
                echo "Closed #$n ($old): superseded by #$number." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            done
