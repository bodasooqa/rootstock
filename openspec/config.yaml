# Конфигурация OpenSpec. Стартовый файл шаблона harness: создаётся один раз,
# дальше принадлежит проекту. Блоки ПРОЕКТ, СТЕК и ГРАНИЦЫ ПАКЕТОВ заполняет
# проект; остальное — общие правила процесса.
schema: spec-driven

context: |
  ЯЗЫК. Все артефакты (proposal, specs, design, tasks) пишутся по-русски.
  По-английски остаются только: имена капабилити и changes (kebab-case),
  идентификаторы кода, команды. Термины домена — из раздела терминов ТЗ,
  не переводить на английский.

  ПРОЕКТ. Что делает система, для кого, в чём главная ценность — заполнить.

  СТЕК. Языки, ключевые библиотеки, правила их использования — заполнить.

  ГРАНИЦЫ ПАКЕТОВ. Карта пакетов и граф зависимостей — заполнить. Дизайн,
  нарушающий этот граф, неверен независимо от удобства.

  ТРИ МЕСТА ЗНАНИЙ, не путать:
  - "docs/design.md — ТЗ. Требования и домен. Владеет владелец."
    Источник истины. Читать, а не дополнять. Журнал ревизий — docs/design-revisions.md.
  - "openspec/specs/ — реализованное поведение по капабилити. Производно от ТЗ."
  - "knowledge/ — накопленное знание: решения и их причины, уроки, особенности"
    внешних API, открытые вопросы. Не требования и не поведение.

  ЭТАПЫ. Реализация идёт строго по этапам из раздела этапов ТЗ; состояние
  этапов — таблица knowledge/stages.md. Один этап — несколько changes, имя change
  начинается с номера этапа (stage3-<имя>). Этап закрыт, когда все его changes
  заархивированы и критерий приёмки выполнен. Change из следующего этапа не
  начинается, пока не закрыт текущий.

rules:
  proposal:
    - "Каждое требование обязано ссылаться на параграф ТЗ (docs/design.md), например «§4». Требования, которого нет в ТЗ, быть не должно — вместо выдумывания задай вопрос владельцу и останови работу."
    - "Назови этап, к которому относится change, и почему он идёт именно сейчас."
    - "Не предлагай новых метрик, полей таблиц и состояний, которых нет в ТЗ."
    - "Раздел «Не входит» обязателен: что этот change сознательно не делает."
  specs:
    - "Описывай наблюдаемое поведение, а не реализацию. Имена типов и функций — в design, не здесь."
    - "Пользуйся терминами ТЗ ровно в их значении."
    - "Пороги и зоны называй именем параметра из ТЗ, а не числом."
  design:
    - "Перечисли затронутые пакеты и проверь, что изменение не нарушает граф зависимостей."
    - "Все пороги, зоны и окна приходят из конфигурации. Числового литерала в дизайне быть не должно."
    - "Если меняется контракт из таблицы «Источники правды» CLAUDE.md — назови это явно и сошлись на скилл contract-change."
    - "Отклонение от ТЗ допустимо, но должно быть названо отклонением с причиной, а не тихо заложено в дизайн."
  tasks:
    - "Порядок TDD: сначала шаг «написать падающий тест», потом «реализовать». Не наоборот."
    - "Один шаг — один осмысленный коммит. Шаг на полдня — это не шаг."
    - "Последним шагом всегда полные проверки: cargo fmt --check, cargo clippy --all-targets --all-features -- -D warnings, cargo test."

operations:
  apply:
    guidance:
      - "Веди работу по TDD: тест раньше реализации, красный раньше зелёного."
      - "Не помечай задачу выполненной, пока соответствующая проверка реально не запущена и не прошла."
      - "Баг по дороге — не чини наугад: сначала systematic-debugging, потом правка."
  archive:
    guidance:
      - "Перед архивацией прогони субагентов spec-auditor, rust-reviewer и приложи их выводы к итогу."
      - "В итог вынеси: что отклонилось от ТЗ и почему, что не удалось проверить без живых данных."
      - "Решения, у которых есть причина, переносятся в knowledge/decisions.md; открытые вопросы — в knowledge/open-questions.md."
